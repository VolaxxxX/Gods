name: Build Android APK

# Manual trigger from the GitHub "Actions" tab → "Build Android APK" → "Run
# workflow". Produces a debug .apk you can download from the run's "Artifacts"
# and sideload onto your phone. (Release/Play-Store signing uses your own
# keystore — see docs/ANDROID_BUILD.md.)
on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build-tools + platform
        run: |
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Download Godot ${{ env.GODOT_VERSION }} headless + export templates
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -L -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -L -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -o godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -o templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Generate a debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Point Godot's editor settings at the Android SDK
        run: |
          # First run generates the editor settings file; then inject the SDK path.
          godot --headless --editor --quit 2>/dev/null || true
          SETTINGS=$(find ~/.config/godot -name 'editor_settings-4*.tres' | head -1)
          echo "settings: $SETTINGS  sdk: $ANDROID_SDK_ROOT"
          sed -i '/^\[resource\]/a export/android/android_sdk_path = "'"$ANDROID_SDK_ROOT"'"' "$SETTINGS"

      - name: Import project (generate .godot)
        run: godot --headless --import 2>/dev/null || true

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p builds/android
          godot --headless --export-debug "Android" builds/android/gods.apk
          ls -la builds/android/

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: gods-debug-apk
          path: builds/android/gods.apk
          if-no-files-found: error
